packages:
  - apps/*
  - packages/*
  - '!**/test/**'
  - templates/*
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - workerd
minimumReleaseAge: 0
overrides:
  typescript: 6.0.3
  vite: 7.3.6
  postcss: 8.5.26
  postcss-selector-parser: 7.1.5
  js-yaml: 4.3.1
  nanoid: 3.3.18
  brace-expansion: 5.0.9
  cross-spawn: 7.0.6
  adm-zip: 0.6.0
  uuid: 11.1.1
  esbuild: 0.28.1
allowBuilds:
  esbuild: true
  msgpackr-extract: true
versioning:
  fixed: []
  ignore: []
  changelog:
    storage: repository
